<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Open Sans for text and interface, as Bird & Bird serve it; Source Serif 4
         for headlines, standing in for their licensed Publico Headline. -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />

    <!--
      Vendor stylesheets are served from /public/css so their relative ../fonts/
      references resolve as they did in the original template. Bootstrap is not
      linked here: it is compiled into style.scss, matching the original build.

      The icon fonts are SUBSET to the glyphs this site actually uses — icomoon
      alone was 307 KB of font and 80 KB of CSS for nine icons. AOS is unused.
    -->
    <link rel="stylesheet" href="/css/open-iconic-subset.css" />
    <link rel="stylesheet" href="/css/animate-subset.css" />
    <link rel="stylesheet" href="/css/ionicons-subset.css" />
    <link rel="stylesheet" href="/css/flaticon.css" />
    <link rel="stylesheet" href="/css/icomoon-subset.css" />
    <!-- Owl Carousel and Magnific Popup stylesheets style the carousels and the
         video popup, which React renders with the plugins' own markup. -->
    <link rel="stylesheet" href="/css/owl.carousel.min.css" />
    <link rel="stylesheet" href="/css/owl.theme.default.min.css" />
    <link rel="stylesheet" href="/css/magnific-popup.css" />

    <title>PCN Sportiva LP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
