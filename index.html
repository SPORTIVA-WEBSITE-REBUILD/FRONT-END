<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 900 was requested but never used; dropping it saves a face. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!--
      Vendor stylesheets are served from /public/css so their relative ../fonts/
      references resolve as they did in the original template. Bootstrap is not
      linked here: it is compiled into style.scss, matching the original build.

      The icon fonts are SUBSET to the glyphs this site actually uses — icomoon
      alone was 307 KB of font and 80 KB of CSS for nine icons. Owl Carousel,
      Magnific Popup and AOS were dropped entirely: their markup is not rendered
      by the React build, only overridden in style.scss.
    -->
    <link rel="stylesheet" href="/css/open-iconic-subset.css" />
    <link rel="stylesheet" href="/css/animate-subset.css" />
    <link rel="stylesheet" href="/css/ionicons-subset.css" />
    <link rel="stylesheet" href="/css/flaticon.css" />
    <link rel="stylesheet" href="/css/icomoon-subset.css" />

    <title>PCN Sportiva LP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
