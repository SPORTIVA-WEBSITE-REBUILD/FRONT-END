# Netlify deploy config. vercel.json is kept alongside it; neither platform
# reads the other's file, so both remain valid targets.

[build]
  command = "npm run build"
  publish = "dist"

# Serves link-preview crawlers (WhatsApp, etc.) a small server-rendered page
# with real title/description/image tags — they do not run JavaScript, so
# without this every shared link shows the bare index.html shell. See
# netlify/edge-functions/prerender.js and lib/prerender.js. Runs before the
# SPA fallback below; ordinary visitors pass straight through it untouched.
[[edge_functions]]
  path = "/*"
  function = "prerender"
  excludedPath = ["/assets/*", "/css/*", "/fonts/*", "/favicon.png", "/robots.txt", "/sitemap.xml"]

# Served live by the API so a newly published article appears in the sitemap
# without a frontend redeploy.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://pcn-sportiva-api.netlify.app/api/public/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://pcn-sportiva-api.netlify.app/api/public/robots.txt"
  status = 200
  force = true

# SPA fallback. Must come last: Netlify takes the first rule that matches.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
