# Netlify deploy config. vercel.json is kept alongside it; neither platform
# reads the other's file, so both remain valid targets.

[build]
  command = "npm run build"
  publish = "dist"

# Serves link-preview crawlers (WhatsApp, etc.) a small server-rendered page
# with real title/description/image tags — they do not run JavaScript, so
# without this every shared link shows the bare index.html shell. See
# netlify/edge-functions/prerender.js and lib/prerender.js. Runs before the
# SPA fallback below; ordinary visitors pass straight through it untouched.
[[edge_functions]]
  path = "/*"
  function = "prerender"
  excludedPath = ["/assets/*", "/css/*", "/fonts/*", "/favicon.png", "/robots.txt", "/sitemap.xml"]

# The default *.netlify.app address stays reachable after a custom domain is
# attached, which lets Google index a duplicate of every page. Host-specific,
# so branch/deploy-preview hosts (webinar-preview--..., <id>--...) do not match
# and keep working; only the bare production netlify.app host redirects.
[[redirects]]
  from = "https://pcnsportivalp-web.netlify.app/*"
  to = "https://pcnsportivalp.com/:splat"
  status = 301
  force = true

# Served live by the API so a newly published article appears in the sitemap
# without a frontend redeploy.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://pcnsportivalp-api.netlify.app/api/public/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://pcnsportivalp-api.netlify.app/api/public/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/insights"
  to = "/articles"
  status = 301
  force = true

[[redirects]]
  from = "/insights/*"
  to = "/articles/:splat"
  status = 301
  force = true

# SPA fallback. Must come last: Netlify takes the first rule that matches.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Baseline security headers for every page. No Content-Security-Policy here on
# purpose: the public site embeds video, loads images and fonts from several
# hosts, and a policy written without testing every page could break them.
# X-Frame-Options stops other sites framing ours (clickjacking); nosniff stops
# browsers guessing a file's type; the referrer policy avoids leaking full URLs
# to other sites; Permissions-Policy switches off features the site never uses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Content-Security-Policy for the public site, written from the hosts the site
# actually uses (Google Fonts, Cloudinary images, the API, Vimeo/YouTube video
# popups and an optional Google Maps embed on Contact). Scripts only from this
# site: no inline script, no eval, no third-party script. Styles allow
# 'unsafe-inline' because React and the carousel plugins set style attributes.
# Images may come from any https host since articles reference arbitrary image
# URLs. The preview API host is listed so branch previews keep working; it is
# harmless in production.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://pcnsportivalp-api.netlify.app https://webinar-preview--pcnsportivalp-api.netlify.app; frame-src https://player.vimeo.com https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
